name: Feature
description: New functionality
title: "[FEATURE] "
labels: ["type: feature"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences on what will exist when this is done.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this is needed and where it fits in the system.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Checklist of what to build.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What is deliberately left for later.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we know it's done (tests, manual checks).
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: dependencies
    attributes:
      label: Dependencies
      placeholder: "Blocked by #N"
