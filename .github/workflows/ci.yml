name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# A new commit on the same branch makes the previous run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build StealthDesk.slnx --configuration Release

      # xUnit v3 test projects are executables, so they run with `dotnet run` instead of `dotnet test`.
      # Every *.Tests.csproj under tests/ is picked up, so new test projects join CI without editing this file.
      - name: Run tests
        run: |
          $testProjects = Get-ChildItem -Path "tests" -Recurse -Filter "*.Tests.csproj" | Sort-Object FullName

          if ($testProjects.Count -eq 0) {
            throw "No test projects were found under tests/."
          }

          foreach ($project in $testProjects) {
            Write-Host "Running $($project.Name)..."
            dotnet run --project $project.FullName --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) {
              throw "Test execution failed for $($project.Name)."
            }
          }

  # Tests that call Windows APIs are skipped on Linux, so they run here.
  windows-tests:
    name: Windows tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Build Windows tests
        run: |
          $testProjects = @(
            "tests/StealthDesk.Agent.Tests/StealthDesk.Agent.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            Write-Host "Building $project..."
            dotnet build $project --configuration Release
            if ($LASTEXITCODE -ne 0) {
              throw "Build failed for $project."
            }
          }

      - name: Run Windows tests
        run: |
          $testProjects = @(
            "tests/StealthDesk.Agent.Tests/StealthDesk.Agent.Tests.csproj"
          )

          foreach ($project in $testProjects) {
            Write-Host "Running $project on Windows..."
            dotnet run --project $project --configuration Release --no-build
            if ($LASTEXITCODE -ne 0) {
              throw "Test execution failed for $project."
            }
          }

  # The image builds from a clean checkout, becomes healthy once PostgreSQL answers, and doesn't run as root.
  container-image:
    name: Container image
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the server image
        run: docker build --file backend/StealthDesk.Web.Server/Dockerfile --tag stealthdesk-server:ci .

      - name: Start the server before its database
        run: |
          docker network create stealthdesk
          docker run --detach --name server --network stealthdesk --restart on-failure \
            --env StealthDesk_POSTGRES_HOST=database \
            --env StealthDesk_POSTGRES_USER=postgres \
            --env StealthDesk_POSTGRES_PASSWORD=ci-password \
            stealthdesk-server:ci

      - name: Not healthy without its database
        run: |
          sleep 20
          status=$(docker inspect --format '{{.State.Health.Status}}' server)
          echo "Health without a database: $status"
          test "$status" != "healthy"

      - name: Healthy once PostgreSQL answers
        run: |
          docker run --detach --name database --network stealthdesk --env POSTGRES_PASSWORD=ci-password postgres:17-alpine
          for attempt in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' server)
            if [ "$status" = "healthy" ]; then
              echo "Healthy after $attempt checks."
              exit 0
            fi
            sleep 5
          done
          docker logs server
          exit 1

      - name: Not running as root
        run: |
          user=$(docker exec server id -u)
          echo "The server runs as user $user."
          test "$user" != "0"

      - name: Image labels
        run: |
          docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }} {{ index .Config.Labels "org.opencontainers.image.source" }}' stealthdesk-server:ci
          test -n "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' stealthdesk-server:ci)"
