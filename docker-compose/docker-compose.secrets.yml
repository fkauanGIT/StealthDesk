# StealthDesk with PostgreSQL, reading passwords and the key certificate from Docker secrets.
#
#   1. Copy the secrets.example folder to secrets and fill in the files. Keep them readable only by you.
#   2. Optionally copy .env.example to .env for the settings that aren't secret.
#   3. docker compose -f docker-compose.secrets.yml up -d
#
# Each file in secrets is named after the setting it holds (Bootstrap__AdminPassword is Bootstrap:AdminPassword).
# An empty file leaves the setting off. Save them with Unix line endings: a Windows one stays in the value.
# The telemetry dashboard starts only with: docker compose -f docker-compose.secrets.yml --profile telemetry up -d

name: stealthdesk

services:
  server:
    # Pin a version (SERVER_IMAGE_TAG=0.5.0) and update on purpose. Without a published image, it's built here.
    image: ghcr.io/fkauangit/stealthdesk:${SERVER_IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: StealthDesk.Web.Server/Dockerfile
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - stealthdesk
    env_file:
      - path: .env
        required: false
    environment:
      StealthDesk_EnableDockerSecrets: true
      StealthDesk_POSTGRES_HOST: database
      StealthDesk_POSTGRES_PORT: 5432
      StealthDesk_POSTGRES_DB: ${StealthDesk_POSTGRES_DB:-stealthdesk}
      # A reverse proxy running on the host reaches the server through this gateway.
      StealthDesk_ReverseProxy__DockerGatewayAddress: ${DOCKER_GATEWAY:-172.30.0.1}
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - KeyProtection__Certificate__Base64
      - KeyProtection__Certificate__Password
      - Bootstrap__AdminPassword
      - Bootstrap__AdminTokenSecret
      - Bootstrap__ServerServiceAccountCredentialSecret
      - Email__SmtpPassword
      - Accounts__MicrosoftClientSecret
      - Accounts__GitHubClientSecret

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - stealthdesk
    volumes:
      - database:/var/lib/postgresql/data
    environment:
      POSTGRES_USER_FILE: /run/secrets/POSTGRES_USER
      POSTGRES_PASSWORD_FILE: /run/secrets/POSTGRES_PASSWORD
      POSTGRES_DB: ${StealthDesk_POSTGRES_DB:-stealthdesk}
    secrets:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
    healthcheck:
      # Over TCP: while the image creates the database, it listens on its socket only.
      test: ["CMD-SHELL", "pg_isready --host 127.0.0.1 --dbname \"$$POSTGRES_DB\" --username \"$$(cat /run/secrets/POSTGRES_USER)\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  telemetry:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13.4
    profiles: [telemetry]
    restart: unless-stopped
    ports:
      - "${TELEMETRY_DASHBOARD_PORT:-18888}:18888"
    networks:
      - stealthdesk
    environment:
      Dashboard__Frontend__AuthMode: BrowserToken
      # Reads Dashboard__Frontend__BrowserToken from the secret file of that name.
      ASPIRE_DASHBOARD_FILE_CONFIG_DIRECTORY: /run/secrets
      # Only the server sends telemetry, from inside this network; the port isn't published.
      Dashboard__Otlp__AuthMode: Unsecured
    secrets:
      - Dashboard__Frontend__BrowserToken

volumes:
  database:
    name: stealthdesk-database

networks:
  stealthdesk:
    name: stealthdesk
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.0.0/16}
          gateway: ${DOCKER_GATEWAY:-172.30.0.1}

secrets:
  POSTGRES_USER:
    file: ./secrets/POSTGRES_USER
  POSTGRES_PASSWORD:
    file: ./secrets/POSTGRES_PASSWORD
  KeyProtection__Certificate__Base64:
    file: ./secrets/KeyProtection__Certificate__Base64
  KeyProtection__Certificate__Password:
    file: ./secrets/KeyProtection__Certificate__Password
  Bootstrap__AdminPassword:
    file: ./secrets/Bootstrap__AdminPassword
  Bootstrap__AdminTokenSecret:
    file: ./secrets/Bootstrap__AdminTokenSecret
  Bootstrap__ServerServiceAccountCredentialSecret:
    file: ./secrets/Bootstrap__ServerServiceAccountCredentialSecret
  Email__SmtpPassword:
    file: ./secrets/Email__SmtpPassword
  Accounts__MicrosoftClientSecret:
    file: ./secrets/Accounts__MicrosoftClientSecret
  Accounts__GitHubClientSecret:
    file: ./secrets/Accounts__GitHubClientSecret
  Dashboard__Frontend__BrowserToken:
    file: ./secrets/Dashboard__Frontend__BrowserToken
